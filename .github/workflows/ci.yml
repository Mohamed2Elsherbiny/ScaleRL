name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check scalerl train.py evaluate.py server.py tests

      - name: Run tests
        run: pytest -q

      - name: Smoke train + evaluate (both agents)
        run: |
          python train.py --algo qlearning --steps 20000 --seed 42 --no-plot
          python train.py --algo dqn --steps 8000 --seed 42 --no-plot
          python evaluate.py --episodes 20 --seed 2024 --no-plot

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scalerl:ci .
