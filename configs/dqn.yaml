# Deep Q-Network experiment.
name: dqn-baseline
algo: dqn
seed: 42
total_steps: 200000
eval_every_steps: 10000

env:
  max_steps: 500

dqn:
  hidden_sizes: [64, 64]
  gamma: 0.95
  learning_rate: 0.001
  batch_size: 64
  buffer_size: 50000
  warmup_steps: 1000
  train_every: 4
  target_sync_every: 500
  epsilon_decay: 0.99
